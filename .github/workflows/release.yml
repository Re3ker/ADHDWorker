name: CI & Release

# Push auf main / Pull Requests: nur prüfen.
# Tag wie v0.2.0: prüfen, Windows-Installer bauen und als Release veröffentlichen.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps

      - name: Version aus dem Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: npm version "${{ github.ref_name }}".TrimStart("v") --no-git-tag-version --allow-same-version

      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
        env:
          ADHDWORKER_SMOKE_DB: ${{ runner.temp }}/adhdworker-smoke.db

      - name: Windows-Installer bauen
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run package:win

      # latest.yml und .blockmap braucht der Auto-Updater der installierten App.
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ADHDWorker ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
