name: Release Windows app

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.version = "$($package.version)-auto.${{ github.run_number }}"
          $package | ConvertTo-Json -Depth 100 | Set-Content package.json
          "version=$($package.version)" >> $env:GITHUB_OUTPUT
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run smoke
        env:
          ADHDWORKER_SMOKE_DB: ${{ runner.temp }}/adhdworker-smoke.db
      - run: npm run package:win
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ADHDWorker v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          files: release/*.exe
